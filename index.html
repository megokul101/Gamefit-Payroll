function pickMonth(){return '<input aria-label="Pay month" type="month" value="'+month+'" onchange="setMonth(this.value)">'}
function count(row,type){return row.counts[type]||0}
function codeFor(status){return {'Present':'P','Late':'L','Weekly off':'WO','Unpaid weekly off':'UWO','Paid leave':'PL','Unpaid leave':'UL','Holiday':'H','Absent':'A','Half day':'½','Short hours':'SH','Needs review':'?','Unrecorded':'?','Pending':'…','In progress':'IN','Not employed':'N/A'}[status]||status}
function termFor(id){let employee=state.staff.find(s=>s.id===id),saved=(state.monthlyTerms||[]).filter(t=>t.id===id&&t.month<=month).sort((a,b)=>b.month.localeCompare(a.month))[0];let p={salary:employee.salary||0,shift:employee.shift||'09:00',end:employee.end||'18:00',dailyHours:8,halfHours:4,breakMinutes:0,paidLeaveDays:0,weeklyOffDays:0,weeklyOffDates:[],weeklyDay:'',autoAbsent:false,shortHours:false,divisor:'calendar',fixedDivisor:30,effectiveFrom:month+'-01',...saved};if(saved&&saved.month!==month)p.weeklyOffDates=p.weeklyDay!==''?weekdayDates(p.weeklyDay,p.weeklyOffDays):[];return p}
function weekdayDates(weekday,quota){return Array.from({length:daysInMonth()},(_,i)=>month+'-'+String(i+1).padStart(2,'0')).filter(d=>new Date(d+'T12:00:00').getDay()===Number(weekday)).slice(0,Number(quota))}
function tick(name,label,on){return '<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="'+name+'" '+(on?'checked':'')+'>'+label+'</label>'}
function fillOffDates(){let f=$('#form');f.elements.offdates.value=weekdayDates(f.elements.weeklyDay.value,f.elements.weeklyOffDays.value).join(', ')}function editPolicy(id){let s=state.staff.find(s=>s.id===id),p=termFor(id);modal('Monthly policy · '+s.name,'<p>Effective from '+month+'. Values carry forward; allowances reset each calendar month. An existing month can be edited without changing older policy snapshots.</p>'+field('salary','Monthly salary (INR)',p.salary,'number','min="0" step="0.01"')+'<p>Full-day and half-day status follow the hour thresholds below once the shift closes. The LOP checkbox separately controls whether short hours deduct salary.</p><div class="formgrid">'+field('shift','Shift starts',p.shift,'time')+field('end','Shift ends',p.end,'time')+field('dailyHours','Full-day work hours',p.dailyHours,'number','min="0.25" max="24" step="0.25"')+field('halfHours','Half-day minimum hours',p.halfHours,'number','min="0" max="24" step="0.25"')+field('breakMinutes','Unpaid break minutes',p.breakMinutes,'number','min="0" max="720"')+field('lateGraceMinutes','Late-arrival grace minutes',p.lateGraceMinutes||0,'number','min="0" max="240"')+field('paidLeaveDays','Paid leave days / month',p.paidLeaveDays,'number','min="0" max="31" step="1"')+field('weeklyOffDays','Paid weekly offs / month',p.weeklyOffDays,'number','min="0" max="31" step="1"')+'</div><label>Recurring weekly-off day<select name="weeklyDay">'+['Choose dates manually','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((n,i)=>'<option value="'+(i-1<0?'':i-1)+'" '+(String(p.weeklyDay)===String(i-1<0?'':i-1)?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>Actual weekly-off dates (YYYY-MM-DD, comma-separated)<input name="offdates" value="'+esc((p.weeklyOffDates||[]).join(', '))+'" placeholder="Leave blank to generate from weekday"></label><button type="button" class="btn" onclick="fillOffDates()">Generate dates from selected weekday</button><p style="font-size:12px">The first N dates for the selected weekday are used if no dates are entered. Review five-week months. Use the day calendar for rotating offs.</p>'+dropdown('divisor','LOP divisor',['calendar','fixed'],p.divisor)+field('fixedDivisor','Fixed salary divisor (used only for fixed)',p.fixedDivisor,'number','min="1" max="31" step="1"')+field('effectiveFrom','Employment / policy effective date',p.effectiveFrom,'date')+tick('autoAbsent','Deduct LOP for completed workdays with no attendance',p.autoAbsent)+tick('shortHours','Deduct LOP for half-day / absent hour classifications',p.shortHours),v=>{let numbers=['salary','dailyHours','halfHours','breakMinutes','paidLeaveDays','weeklyOffDays','fixedDivisor','lateGraceMinutes'];numbers.forEach(k=>v[k]=Number(v[k]));v.autoAbsent=!!v.autoAbsent;v.shortHours=!!v.shortHours;if(v.halfHours>v.dailyHours){toast('Half-day threshold must not exceed full-day hours');return false}let dates=v.offdates.split(',').map(d=>d.trim()).filter(Boolean);if(!dates.length&&v.weeklyDay!=='')dates=weekdayDates(v.weeklyDay,v.weeklyOffDays);dates=[...new Set(dates)].sort();if(dates.some(d=>!/^\d{4}-\d{2}-\d{2}$/.test(d)||!d.startsWith(month+'-')||Number(d.slice(8))>daysInMonth())||dates.length>v.weeklyOffDays){toast('Choose valid dates within this month and the weekly-off allowance');return false}delete v.offdates;let terms={...v,id,month,weeklyOffDates:dates};state.monthlyTerms=(state.monthlyTerms||[]).filter(t=>!(t.id===id&&t.month===month));state.monthlyTerms.push(terms);s.salary=v.salary;s.shift=v.shift;s.end=v.end;calculationKey='';calculation=null})}
function shifts(){return heading('Hours, leave and weekly offs.','Configure each person’s monthly salary and attendance rules.')+'<div class="toolbar">'+pickMonth()+'<span class="pill">Policy effective month</span></div><div class="notice">No company policy has been assumed. Configure allowances before applying automatic LOP. Paid leave above the monthly allowance becomes unpaid; weekly offs need actual dates. Missing check-outs remain review items. Hours use the first-to-last punch span minus the configured break; review split and overnight shifts.</div><div class="card">'+toolbar()+table(['Staff member','Salary','Hours / day','Paid leave / month','Weekly offs / month','LOP rule',''],filtered().map(s=>{let p=termFor(s.id),configured=(state.monthlyTerms||[]).some(t=>t.id===s.id&&t.month<=month);return '<tr><td>'+person(s)+'</td><td>'+money(p.salary)+'</td><td>'+p.dailyHours+'h <small>'+esc(p.shift)+' – '+esc(p.end)+'</small></td><td>'+p.paidLeaveDays+'</td><td>'+p.weeklyOffDays+'</td><td>'+badge(configured?(p.autoAbsent?'Automatic absence':'Review missing days'):'Not configured')+'</td><td><button class="link" onclick="editPolicy(\''+s.id+'\')">Configure policy</button></td></tr>'}))+ '</div>'}
function payroll(){let rows=payrollRows();return heading('Every day accounted for.','Review monthly attendance and salary before issuing payslips.',btn('+ Adjustment','adjustment()')+btn('↓ Payroll CSV','exportPayroll()',true))+'<div class="toolbar">'+pickMonth()+btn('Review snapshots','saveRun()')+btn('Payslips',"changePage('Payslips')")+'</div><div class="notice">Draft payroll through '+(readyCalc()?esc(new Date(calculation.asOf).toLocaleString('en-IN')):'today')+'. Future / unfinished dates do not create LOP. Unresolved punches require review. Tax, PF and ESI are not calculated.</div>'+(!readyCalc()?loadingCalc():'<div class="metrics">'+[['Gross salary',money(rows.reduce((n,r)=>n+r.gross,0))],['LOP',money(rows.reduce((n,r)=>n+r.lop,0))],['Bonuses / deductions',money(rows.reduce((n,r)=>n+r.bonus-r.deduction,0))],['Draft net pay',money(rows.reduce((n,r)=>n+r.net,0))]].map(x=>'<div class="card metric"><label>'+x[0]+'</label><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="card">'+toolbar()+table(['Staff','Salary','Paid days','Weekly offs','Paid leave','Unpaid eq.','Review / pending','LOP','Net',''],rows.map(r=>'<tr><td>'+person(r)+'</td><td>'+money(r.salary)+'</td><td>'+r.paidDays+'</td><td>'+count(r,'Weekly off')+'</td><td>'+count(r,'Paid leave')+'</td><td>'+r.unpaid+'</td><td>'+r.reviewDays+' / '+r.pendingDays+'<small>'+(r.configured?'Policy set':'Policy required')+'</small></td><td>'+money(r.lop)+'</td><td><b>'+money(r.net)+'</b></td><td><button class="link" onclick="viewEmployee(\''+r.id+'\')">Breakdown →</button></td></tr>'))+'</div>'+adjustmentLog()+runHistory())}
function viewEmployee(id){selectedEmployee=id;page='Staff month';render()}
function staffMonth(){let r=readyCalc()?calculation.rows.find(r=>r.id===selectedEmployee):null;return heading(r?r.name+' · '+month:'Monthly employee history','A day-by-day explanation of attendance and pay.',btn('↓ Employee CSV','downloadAttendance(selectedEmployee)')+btn('↓ Draft payslip','downloadSlip(selectedEmployee)'))+'<div class="toolbar">'+pickMonth()+'<select aria-label="Select staff" onchange="selectedEmployee=this.value;render()">'+state.staff.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===selectedEmployee?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select>'+btn('Edit monthly policy','editPolicy(selectedEmployee)')+'</div>'+(!r?loadingCalc():'<div class="metrics">'+[['Salary',money(r.salary)],['Paid leave / offs',count(r,'Paid leave')+' / '+count(r,'Weekly off')],['LOP days / amount',r.unpaid+' / '+money(r.lop)],['Draft net',money(r.net)]].map(x=>'<div class="card metric"><label>'+x[0]+'</label><strong style="font-size:24px">'+x[1]+'</strong></div>').join('')+'</div><div class="card"><p>Policy: '+r.policy.dailyHours+' hours/day · '+r.policy.paidLeaveDays+' paid leaves/month · '+r.policy.weeklyOffDays+' paid offs/month · divisor '+r.divisor+'. Paid credits count completed days only.</p><br>'+table(['Date','Day type','First in','Last out','Work hours','LOP days','Explanation',''],r.days.map(d=>'<tr><td>'+d.date+'</td><td>'+badge(d.status)+(d.pending?'<small>Planned / pending</small>':'')+'</td><td>'+esc(d.in||'—')+'</td><td>'+esc(d.out||'—')+'</td><td>'+(d.hours??'—')+'</td><td>'+d.lop+'</td><td>'+esc(d.reason||d.note||'Recorded')+'</td><td><button class="link" onclick="dayOverride(\''+r.id+'\',\''+d.date+'\')">Set day</button></td></tr>'))+'</div>')}
function dayOverride(id,date){let old=(state.dayOverrides||[]).find(o=>o.id===id&&o.date===date);modal('Set day · '+staffName(id)+' · '+date,dropdown('type','Day classification',['Use device / schedule','Weekly off','Paid leave','Unpaid leave','Holiday','Present','Half day','Absent'],old?.type||'Use device / schedule')+field('reason','Reason',old?.reason||'')+'<p>Paid leave and weekly offs consume monthly allowances. Excess days become unpaid. This does not change raw device punches.</p>',v=>{state.dayOverrides=(state.dayOverrides||[]).filter(o=>!(o.id===id&&o.date===date));if(v.type!=='Use device / schedule')state.dayOverrides.push({id,date,...v,changedAt:new Date().toISOString()});calculation=null;calculationKey=''})}
function dayStatus(id,date){return readyCalc()?calculation.rows.find(r=>r.id===id)?.days.find(d=>d.date===date)?.status||'Unrecorded':'Unrecorded'}
function monthlyRegister(){if(!readyCalc())return loadingCalc();let rows=payrollRows();return '<div class="toolbar">'+pickMonth()+btn('↓ Monthly muster CSV','exportMuster()')+'</div><p style="font-size:12px;margin-bottom:18px">P present · WO paid weekly off · PL paid leave · UL unpaid leave · H holiday · ½ half day · A absent · ? review · … pending. Click a name for history and corrections.</p>'+table(['Staff',...Array.from({length:daysInMonth()},(_,i)=>i+1)],rows.map(r=>'<tr><td style="min-width:155px"><button class="link" onclick="viewEmployee(\''+r.id+'\')">'+esc(r.name)+'</button></td>'+r.days.map(d=>'<td title="'+esc(d.status+' '+d.note)+'" style="padding:10px 7px;color:'+(d.lop?'#b76357':d.review?'#b48c3f':'#447558')+'">'+codeFor(d.status)+'</td>').join('')+'</tr>'))}
function downloadAttendance(id){if(!readyCalc())return toast('Wait for the month calculation');let rows=id?calculation.rows.filter(r=>r.id===id):payrollRows();csv('gamefit-attendance-'+month+(id?'-'+id:'')+'.csv',['ID','Name','Section','Date','Day type','First in','Last out','Hours','Paid credit','LOP days','Review','Pending','Explanation','Source'],rows.flatMap(r=>r.days.map(d=>[r.id,r.name,r.section,d.date,d.status,d.in,d.out,d.hours,d.credit,d.lop,d.review,d.pending,d.reason||d.note,d.source])))}

function individualReport(){modal('Individual monthly report',staffSelect()+field('month','Month',month,'month'),v=>{selectedEmployee=v.id;month=v.month;page='Staff month';calculation=null;calculationKey=''})}
function saveRun(){let rows=payrollRows();if(!readyCalc()||!rows.length)return toast('No calculated employees in this selection');if(rows.some(r=>!r.configured||r.salary<=0))return toast('Set each monthly policy and salary first');state.runs.push({month,created:new Date().toISOString(),rows:JSON.parse(JSON.stringify(rows)),status:'Draft review snapshot'});save();render();toast('Draft snapshot saved; pending and review days remain visible')}
function downloadSlip(id,reference=''){let a=document.createElement('a');a.href='/api/payslip?month='+encodeURIComponent(month)+'&id='+encodeURIComponent(id)+(reference?'&reference='+encodeURIComponent(reference):'');a.download='Gamefit-'+(reference?'Payslip':'DRAFT-Payslip')+'-'+month+'-'+id+'.pdf';a.click()}
async function issueSlip(id){try{await saveQueue;if(saveFailed)throw Error('Resolve the save error first');let r=await fetch('/api/issue-payslip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,month})}),x=await r.json();if(!r.ok)throw Error(x.error);state=x.state;baseState=JSON.parse(JSON.stringify(state));revision=x.revision;calculationKey='';render();downloadSlip(id,x.reference);toast('Payslip issued and saved: '+x.reference)}catch(e){toast(e.message)}}
function payslips(){let rows=payrollRows(),issued=(state.payslips||[]).filter(p=>p.month===month);return heading('Payslips, ready to share.','Download draft PDFs now. Issue a saved payslip after the month is complete.')+'<div class="toolbar">'+pickMonth()+'</div><div class="notice">Issued payslips keep their original salary and attendance breakdown. Issuing a payslip does not transfer money. The current month remains a draft while future dates or unresolved days exist.</div>'+(!readyCalc()?loadingCalc():'<div class="card">'+toolbar()+table(['Staff','Salary','Draft net','Readiness',''],rows.map(r=>{let slip=issued.find(p=>p.id===r.id);return '<tr><td>'+person(r)+'</td><td>'+money(r.salary)+'</td><td>'+money(r.net)+'</td><td>'+esc(slip?'Issued '+slip.reference:!r.configured?'Policy required':r.reviewDays+' review / '+r.pendingDays+' pending')+'</td><td><button class="link" onclick="downloadSlip(\''+r.id+'\')">Draft PDF</button> '+(slip?'<button class="link" onclick="downloadSlip(\''+r.id+'\',\''+slip.reference+'\')">Issued PDF</button>':'<button class="link" '+(!r.configured||r.salary<=0||r.reviewDays||r.pendingDays?'disabled':'')+' onclick="issueSlip(\''+r.id+'\')">Issue payslip</button>')+'</td></tr>'}))+ '</div>')}
async function deviceRequest(path,body){await saveQueue;if(saveFailed)throw Error('Resolve the save error first');let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),x=await r.json();if(!r.ok)throw Error(x.error||'Device operation failed');if(x.state&&x.revision!=null){state=x.state;baseState=JSON.parse(JSON.stringify(x.state));revision=x.revision}else await readWorkspace();return x}

function addStaff(id){let old=state.staff.find(s=>s.id===id)||{};modal(id?'Edit staff profile':'Add staff profile',field('id','Biometric ID',old.id||'','text',id?'readonly':'pattern="[0-9]+"')+field('name','Full name',old.name||'')+field('section','Section',old.section||'Unassigned')+field('role','Role',old.role||'Staff')+field('salary','Default monthly salary (INR)',old.salary||0,'number','min="0" step="0.01"')+field('shift','Default shift starts',old.shift||'09:00','time')+field('end','Default shift ends',old.end||'18:00','time')+'<p>A new person is created on the eSSL terminal with this biometric ID. People added on the terminal appear in this directory after the next sync. Fingerprints are captured on the machine. Salary and allowances stay in Shifts & policies.</p>',()=>false);let button=$('#form .primary');button.textContent=id?'Save profile':'Add staff on terminal';$('#form').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(!id&&state.staff.some(s=>s.id===v.id)){toast(state.staff.find(s=>s.id===v.id)?.status==='Deleted'?'This ID belongs to a deleted profile. Restore it from Deleted staff.':'This biometric ID exists');return}if(!/^\d{1,20}$/.test(v.id)){toast('Enter a numeric biometric ID');return}let row={...old,...v,salary:Number(v.salary),status:old.status||'Active'};let enroll=!id||(row.status==='Active'&&row.deviceEnrolled!==true);button.disabled=true;try{if(enroll&&cloudMode){applyStaff(row);await save();if(saveFailed)return;let x=await deviceRequest('/api/device/users/enroll',{id:row.id,name:row.name,action:'enroll'});$('#modal').close();render();toast(x.message)}else if(enroll){let x=await deviceRequest('/api/device/users/enroll',{id:row.id,name:row.name});if(!['Enrolled','Already enrolled'].includes(x.status))throw Error(x.message||'The terminal did not confirm this user');applyStaff({...row,deviceEnrolled:true,deviceUid:x.deviceUid,deviceName:x.deviceName||row.name});await save();if(saveFailed)return;$('#modal').close();render();toast(x.message)}else{applyStaff(row);await save();if(saveFailed)return;$('#modal').close();render();toast('Saved successfully')}}catch(err){toast(err.message);button.disabled=false}}}
function staff(){return heading('Your people','Profiles, salaries and individual monthly history.',btn('Device users',"changePage('Device users')")+btn('↑ Import device users',"importCSV('staff')")+btn('+ Add staff','addStaff()',true))+'<div class="toolbar">'+pickMonth()+'</div><div class="card">'+toolbar()+table(['Staff','Section','Role','Monthly salary','Status',''],filtered().map(s=>'<tr><td>'+person(s)+'</td><td>'+esc(s.section)+'</td><td>'+esc(s.role)+'</td><td>'+money(termFor(s.id).salary)+'</td><td>'+badge(s.status)+'</td><td><button class="link" onclick="addStaff(\''+s.id+'\')">Profile</button><button class="link" onclick="editPolicy(\''+s.id+'\')">Pay policy</button><button class="link" onclick="viewEmployee(\''+s.id+'\')">Monthly history →</button></td></tr>'))+'</div>'}

let employeeView='calendar';
function weekdayLabel(date,short=false){return new Date(date+'T12:00:00').toLocaleDateString('en-IN',{weekday:short?'short':'long'})}

function deleteStaff(id){let s=state.staff.find(s=>s.id===id);if(!s||s.status==='Deleted')return;modal('Delete staff · '+esc(s.name),'<p>This removes the person from active staff and from the eSSL terminal. Attendance, pay policies and payslips stay in Deleted staff.</p>'+field('lastDay','Last working day',todayIndia(),'date','max="'+todayIndia()+'"')+field('reason','Reason for deletion','','text','minlength="3" maxlength="300"')+field('confirmId','Type employee ID '+esc(id)+' to confirm','','text','autocomplete="off"')+tick('acknowledged','I understand this removes their enrollment from the biometric terminal.',false)+'<p>The directory profile is deleted only after the terminal removes this ID, or confirms it is already absent. The last device administrator is protected.</p>',()=>false);let button=$('#form .primary');button.textContent='Delete from directory and terminal';button.classList.add('danger');$('#form').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(v.lastDay>todayIndia())return toast('The last working day cannot be in the future');if(s.joinDate&&v.lastDay<s.joinDate)return toast('The last working day is before the joining date');if(v.confirmId!==id||!v.acknowledged)return toast('Type the exact employee ID and acknowledge the terminal removal');button.disabled=true;try{let x=await deviceRequest('/api/device/users/remove',{id,confirmId:v.confirmId,reason:v.reason,acknowledged:true,action:'remove'});if(!cloudMode&&!['Deleted','Already absent'].includes(x.status))throw Error(x.message||'The terminal did not confirm removal');let person=state.staff.find(p=>p.id===id);if(!person)throw Error('Staff member not found');person.deletion={previousStatus:person.status,previousEndDate:person.employmentEndDate??null,at:new Date().toISOString(),reason:v.reason,lastDay:v.lastDay};person.status='Deleted';person.employmentEndDate=v.lastDay;person.deviceEnrolled=false;state.staffEvents=state.staffEvents||[];state.staffEvents.push({id,action:'Deleted',at:person.deletion.at,reason:v.reason,lastDay:v.lastDay});calculation=null;calculationKey='';await save();if(saveFailed)return;$('#modal').close();render();toast(x.message||'Deleted from the directory and the terminal')}catch(err){toast(err.message);button.disabled=false}}}
function restoreStaff(id){let s=state.staff.find(s=>s.id===id);if(!s||s.status!=='Deleted')return;modal('Restore staff · '+esc(s.name),'<p>This restores the profile and creates the user ID on the eSSL terminal again. Fingerprints must be captured on the machine.</p>'+field('reason','Reason for restoration'),()=>false);let button=$('#form .primary');button.textContent='Restore and enroll';$('#form').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));button.disabled=true;try{let restored={...s,status:s.deletion?.previousStatus||'Active',restoredAt:new Date().toISOString()};if(s.deletion?.previousEndDate)restored.employmentEndDate=s.deletion.previousEndDate;else delete restored.employmentEndDate;if(cloudMode){applyStaff(restored);state.staffEvents=state.staffEvents||[];state.staffEvents.push({id,action:'Restored',at:restored.restoredAt,reason:v.reason});await save();if(saveFailed)return;let x=await deviceRequest('/api/device/users/enroll',{id,name:restored.name,action:'enroll'});$('#modal').close();render();toast(x.message);return}let x=await deviceRequest('/api/device/users/enroll',{id,name:s.name});if(!['Enrolled','Already enrolled'].includes(x.status))throw Error(x.message||'The terminal did not confirm this user');let person=state.staff.find(p=>p.id===id);if(!person)throw Error('Staff member not found');person.status=s.deletion?.previousStatus||'Active';if(s.deletion?.previousEndDate)person.employmentEndDate=s.deletion.previousEndDate;else delete person.employmentEndDate;person.deviceEnrolled=true;person.deviceUid=x.deviceUid;person.deviceName=x.deviceName||person.name;person.restoredAt=new Date().toISOString();state.staffEvents=state.staffEvents||[];state.staffEvents.push({id,action:'Restored',at:person.restoredAt,reason:v.reason});calculation=null;calculationKey='';await save();if(saveFailed)return;$('#modal').close();render();toast(x.message)}catch(err){toast(err.message);button.disabled=false}}}

async function loadCompanyLogo(input){let file=input.files?.[0];if(!file)return;if(file.size>10*1024*1024){toast('Choose an image smaller than 10 MB');return}companyLogoDraft=null;try{let url=URL.createObjectURL(file),img=new Image();try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Cannot read this image'));img.src=url});let scale=Math.min(1,512/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/png');if(data.length>341000)throw Error('Image is too detailed; choose a simpler logo');companyLogoDraft=data;$('#logo-preview').innerHTML='<img class="company-logo" alt="Selected logo" src="'+data+'">'}finally{URL.revokeObjectURL(url)}}catch(e){companyLogoDraft=companyProfile().logo||'';toast(e.message)}}

let cloudMode=false;
const collectionKeys={staff:['id'],attendance:['id','date'],monthlyTerms:['id','month'],dayOverrides:['id','date']};
function recordIdentity(row,fields){return fields.map(k=>String(row[k]??'')).join('|')}
function makeChanges(base,next){let changes=[];for(let key of new Set([...Object.keys(base||{}),...Object.keys(next||{})])){if(['device','connector','payslips','deviceCommands','_loadedMonth'].includes(key)||key.startsWith('_'))continue;let old=base?.[key],value=next?.[key];if(JSON.stringify(old)===JSON.stringify(value))continue;let fields=collectionKeys[key];if(fields){let a=new Map((old||[]).map(x=>[recordIdentity(x,fields),x])),b=new Map((value||[]).map(x=>[recordIdentity(x,fields),x])),items=[];for(let id of new Set([...a.keys(),...b.keys()]))if(JSON.stringify(a.get(id))!==JSON.stringify(b.get(id)))items.push({id,base:a.get(id)||null,value:b.get(id)||null});if(items.length)changes.push({key,items})}else changes.push({key,base:old??null,value:value??null})}return changes}
function save(){let snapshot=JSON.parse(JSON.stringify(state)),baseline=JSON.parse(JSON.stringify(baseState||state));saveQueue=saveQueue.then(async()=>{let changes=makeChanges(baseline,snapshot);if(!changes.length)return;let r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({changes,month,revision})}),x=await r.json();if(!r.ok)throw Error(x.error);revision=x.revision;baseState=JSON.parse(JSON.stringify(x.state));if(JSON.stringify(state)===JSON.stringify(snapshot))state=x.state;saveFailed=false;calculationKey='';render()}).catch(e=>{saveFailed=true;toast('SAVE FAILED: '+e.message+' Back up changes before reloading.')});return saveQueue}
async function readWorkspace(){let r=await fetch('/api/state'+(cloudMode?'?month='+encodeURIComponent(month):''));if(r.status===401){location.href='/login';throw Error('Sign in required')}let x=await r.json();if(!r.ok)throw Error(x.error||'Cannot load workspace');state=x.state;baseState=JSON.parse(JSON.stringify(state));revision=x.revision;syncStatus=x.syncStatus||null;cloudMode=!!x.cloudMode;return x}
function setMonth(v){month=v;calculation=null;calculationKey='';if(cloudMode){saveQueue.then(()=>{if(saveFailed)throw Error('Resolve save failure before changing month');return readWorkspace()}).then(render).catch(e=>toast(e.message))}else render()}
async function refreshLive(){if(refreshing||syncing||saveFailed||$('#modal').open||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;refreshing=true;try{await saveQueue;let r=await fetch('/api/revision');if(r.status===401){location.href='/login';return}let x=await r.json();if(!r.ok)throw Error('Server unavailable');let statusChanged=JSON.stringify(syncStatus)!==JSON.stringify(x.syncStatus);syncStatus=x.syncStatus;deviceError=syncStatus?.error||'';if(x.revision!==revision){await readWorkspace();render()}else if(statusChanged)render()}catch(e){deviceError=e.message}finally{refreshing=false}}
async function boot(){try{await readWorkspace();render()}catch(e){$('#app').textContent=e.message}}

const originalLocalDevicePage=pages['Device & sync'];pages['Device & sync']=()=>cloudMode?cloudDevicePage():originalLocalDevicePage();

function deviceUsersPage(){let users=state.staff.filter(s=>s.deviceEnrolled===true),jobs=state.deviceCommands||[];return heading('Biometric device users','Manage the actual enrollments on the eSSL terminal.',btn('Refresh users',cloudMode?'readWorkspace().then(render)':'syncDevice()',true))+'<div class="notice">Deleting here sends a real device-user deletion request. Enrollment information may be removed and may require re-enrollment to restore. This page removes only the terminal enrollment. Deleting someone in the staff directory removes both the directory profile and the terminal user.</div><div class="card">'+table(['Biometric ID','Device name','App profile','Device enrollment',''],users.map(s=>'<tr><td><b>'+esc(s.id)+'</b></td><td>'+esc(s.deviceName||s.name)+'</td><td>'+esc(s.name)+'<small>'+esc(s.status)+'</small></td><td>'+badge('Enrolled')+'</td><td><button class="link danger-link" '+(!Number.isInteger(s.deviceUid)?'disabled':'')+' onclick="confirmDeviceDelete(\''+s.id+'\')">Delete from device</button></td></tr>'))+'<p>If the enrolled-user list or internal UID is unavailable, run one successful device sync first.</p></div>'+(jobs.length?'<div class="card" style="margin-top:20px"><h2>Device command history</h2><br>'+table(['User ID','Requested','Status','Result'],jobs.map(j=>'<tr><td>'+esc(j.staffId)+'</td><td>'+esc(new Date(j.createdAt*1000).toLocaleString('en-IN'))+'</td><td>'+badge(j.status)+'</td><td>'+esc(j.result?.message||'Waiting for connector')+'</td></tr>'))+'</div>':'')}
function confirmDeviceDelete(id){let s=state.staff.find(s=>s.id===id);if(!s||!Number.isInteger(s.deviceUid))return toast('Refresh the device user list first');modal('Delete enrollment · '+esc(s.deviceName||s.name),'<div class="notice">Permanent device action for employee ID '+esc(id)+'. Biometric enrollment may be removed. Restoring the app profile will not restore the device enrollment.</div>'+field('confirmId','Type the exact employee ID to confirm','','text','autocomplete="off"')+field('reason','Reason for deleting device enrollment','','text','minlength="3" maxlength="300"')+tick('acknowledged','I understand that enrollment may need to be created again on the terminal.',false)+'<p>The last device administrator is protected. No other users or attendance logs will be deleted.</p>',()=>false);let button=$('#form .primary');button.textContent=cloudMode?'Queue confirmed device deletion':'Permanently delete from device';button.classList.add('danger');$('#form').onsubmit=async e=>{e.preventDefault();let values=Object.fromEntries(new FormData(e.target));if(values.confirmId!==id||!values.acknowledged)return toast('Type the exact employee ID and acknowledge the warning');button.disabled=true;try{await saveQueue;if(saveFailed)throw Error('Resolve the save error first');let r=await fetch('/api/device/users/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,confirmId:values.confirmId,reason:values.reason,acknowledged:true,expectedUid:s.deviceUid,expectedName:s.deviceName||s.name})}),x=await r.json();if(!r.ok)throw Error(x.error||'Device operation failed');await readWorkspace();$('#modal').close();render();toast(x.message)}catch(err){toast(err.message);button.disabled=false}}}

boot();let refreshing=false;setInterval(refreshLive,15000);
</script></html>
